    <meta name="theme-color" content="#0A0E14" />

      :root {
        color: #0a0e14;
        background: #f1f2f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .studyShellFallback {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;

        padding:

          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        text-align: center;
      }

      .studyShellFallback h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.35;
      }

      .studyShellFallback p {
        margin: 8px 0 0;
        color: #5b616b;
        font-size: 14px;
        line-height: 1.5;
      }

  <body>
    <div id="study-root">
